<!DOCTYPE html>
<html>

<head>
    <title>Travel Magic</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌍 Travel Magic</h1>
        <p>Explore Beautiful Destinations</p>

        <input type="text" id="search" placeholder="Search Destination">
        <button onclick="searchPlace()">Search</button>

        <button onclick="toggleMode()">🌙 Mode</button>
    </header>

    <div class="container">

        <div class="card" data-place="chennai">
            <h2>🏖 Chennai</h2>
            <p>Marina Beach, Mahabalipuram</p>
        </div>

        <div class="card" data-place="ooty">
            <h2>⛰ Ooty</h2>
            <p>Tea Gardens, Ooty Lake</p>
        </div>

        <div class="card" data-place="goa">
            <h2>🌴 Goa</h2>
            <p>Beaches and Nightlife</p>
        </div>

        <div class="card" data-place="mysore">
            <h2>🏰 Mysore</h2>
            <p>Mysore Palace</p>
        </div>

        <div class="card" data-place="kodaikanal">
            <h2>🌄 Kodaikanal</h2>
            <p>Coaker's Walk, Lake</p>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
